<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Surprise for Riya</title>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@500;700&display=swap" rel="stylesheet">
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    overflow: hidden; overscroll-behavior: none;
    background-color: #fff0f5;
    font-family: 'Poppins', sans-serif;
  }
  body { display: flex; justify-content: center; align-items: center; }

  /* Background: pre-softened radial gradients, no blur filter or blend mode.
     Only transform is animated, so it stays on the GPU. */
  .aurora {
    position: fixed; inset: 0; overflow: hidden; z-index: 0;
    pointer-events: none; contain: strict;
  }
  .blob {
    position: absolute; border-radius: 50%;
    will-change: transform; transform: translate3d(0, 0, 0);
  }
  .blob-pink {
    top: -25%; left: -20%; width: 90vmax; height: 90vmax;
    background: radial-gradient(circle, rgba(255,182,193,.95) 0%, rgba(255,182,193,0) 65%);
    animation: flow1 22s infinite ease-in-out alternate;
  }
  .blob-red {
    bottom: -30%; right: -25%; width: 100vmax; height: 100vmax;
    background: radial-gradient(circle, rgba(255,143,163,.85) 0%, rgba(255,143,163,0) 65%);
    animation: flow2 26s infinite ease-in-out alternate;
  }
  .blob-peach {
    top: 10%; left: 5%; width: 80vmax; height: 80vmax;
    background: radial-gradient(circle, rgba(255,218,185,.9) 0%, rgba(255,218,185,0) 65%);
    animation: flow1 24s infinite ease-in-out alternate-reverse;
  }
  @keyframes flow1 {
    0%   { transform: translate3d(0, 0, 0) scale(1); }
    50%  { transform: translate3d(12vw, 15vh, 0) scale(1.15); }
    100% { transform: translate3d(-8vw, 22vh, 0) scale(.95); }
  }
  @keyframes flow2 {
    0%   { transform: translate3d(0, 0, 0) scale(1); }
    100% { transform: translate3d(-18vw, -12vh, 0) scale(1.2); }
  }

  .card-container {
    position: relative; z-index: 1;
    width: 85%; max-width: 380px; aspect-ratio: 4/3;
    border-radius: 24px; overflow: hidden;
    box-shadow: 0 20px 40px rgba(255,105,180,.25), 0 0 20px rgba(255,255,255,.6);
    background: rgba(255,255,255,.96);
  }
  .message {
    position: absolute; inset: 0;
    display: flex; justify-content: center; align-items: center;
    text-align: center; padding: 20px; box-sizing: border-box;
    font-family: 'Dancing Script', cursive;
    font-size: clamp(2rem, 9vw, 2.8rem); line-height: 1.3;
    background: linear-gradient(135deg, #f43f5e, #db2777);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
    z-index: 1;
  }
  #scratch-pad {
    position: absolute; inset: 0; width: 100%; height: 100%;
    z-index: 2; cursor: crosshair;
    touch-action: none;
    transition: opacity .4s ease;
  }
  .fx-canvas {
    position: fixed; inset: 0; width: 100%; height: 100%;
    pointer-events: none;
  }

  @media (prefers-reduced-motion: reduce) {
    .blob { animation: none; }
  }
</style>
</head>
<body>
  <div class="aurora" aria-hidden="true">
    <div class="blob blob-pink"></div>
    <div class="blob blob-red"></div>
    <div class="blob blob-peach"></div>
  </div>

  <div class="card-container" id="card-container">
    <div class="message">eeeeeeeeee<br>Happiest Birthday<br>Riya!! ❤️❤️</div>
    <canvas id="scratch-pad"></canvas>
  </div>

<script>
(() => {
  const isMobile = matchMedia('(pointer: coarse)').matches || innerWidth < 700;
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const maxDpr = isMobile ? 1.5 : 2;

  /* ---------- Scratch card ---------- */
  const container = document.getElementById('card-container');
  const canvas = document.getElementById('scratch-pad');
  const ctx = canvas.getContext('2d');

  const BRUSH = 35;          // radius in CSS px
  const CELL = 12;           // coverage grid cell size in CSS px
  const REVEAL_AT = 35;      // % scratched to reveal

  let cssW = 0, cssH = 0, lastW = 0;
  let cols = 0, rows = 0, covered = null, coveredCount = 0;
  let isDrawing = false, isRevealed = false;
  let lastX = 0, lastY = 0;

  // Small noise tile, built once and reused as a pattern
  const noiseTile = (() => {
    const t = document.createElement('canvas');
    t.width = t.height = 64;
    const c = t.getContext('2d');
    c.fillStyle = 'rgba(255,255,255,.4)';
    for (let i = 0; i < 64; i += 4)
      for (let j = 0; j < 64; j += 4)
        if (Math.random() > .5) c.fillRect(i, j, 2, 2);
    return t;
  })();

  function initCanvas() {
    const dpr = Math.min(devicePixelRatio || 1, 2);
    cssW = container.offsetWidth;
    cssH = container.offsetHeight;
    lastW = innerWidth;
    canvas.width = Math.round(cssW * dpr);
    canvas.height = Math.round(cssH * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    cols = Math.ceil(cssW / CELL);
    rows = Math.ceil(cssH / CELL);
    covered = new Uint8Array(cols * rows);
    coveredCount = 0;

    drawCover();
    ctx.globalCompositeOperation = 'destination-out';
    ctx.lineWidth = BRUSH * 2;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
  }

  function drawCover() {
    ctx.globalCompositeOperation = 'source-over';
    const g = ctx.createLinearGradient(0, 0, cssW, cssH);
    g.addColorStop(0, '#e2e8f0');
    g.addColorStop(.5, '#cbd5e1');
    g.addColorStop(1, '#94a3b8');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, cssW, cssH);

    ctx.fillStyle = ctx.createPattern(noiseTile, 'repeat');
    ctx.fillRect(0, 0, cssW, cssH);

    ctx.fillStyle = '#64748b';
    ctx.font = 'bold 22px Poppins, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('✨ Scratch Here ✨', cssW / 2, cssH / 2);
  }

  // Coverage is tracked on a coarse grid, so there's no getImageData readback
  function markCells(x, y) {
    const r2 = BRUSH * BRUSH;
    const c0 = Math.max(0, Math.floor((x - BRUSH) / CELL));
    const c1 = Math.min(cols - 1, Math.floor((x + BRUSH) / CELL));
    const r0 = Math.max(0, Math.floor((y - BRUSH) / CELL));
    const r1 = Math.min(rows - 1, Math.floor((y + BRUSH) / CELL));
    for (let r = r0; r <= r1; r++) {
      const cy = r * CELL + CELL / 2 - y;
      for (let c = c0; c <= c1; c++) {
        const cx = c * CELL + CELL / 2 - x;
        if (cx * cx + cy * cy <= r2) {
          const i = r * cols + c;
          if (!covered[i]) { covered[i] = 1; coveredCount++; }
        }
      }
    }
  }

  function markSegment(x0, y0, x1, y1) {
    const dist = Math.hypot(x1 - x0, y1 - y0);
    const steps = Math.max(1, Math.ceil(dist / (BRUSH / 2)));
    for (let s = 1; s <= steps; s++) {
      const t = s / steps;
      markCells(x0 + (x1 - x0) * t, y0 + (y1 - y0) * t);
    }
  }

  function pos(e) {
    const rect = canvas.getBoundingClientRect();
    return { x: e.clientX - rect.left, y: e.clientY - rect.top };
  }

  function onDown(e) {
    if (isRevealed) return;
    isDrawing = true;
    canvas.setPointerCapture?.(e.pointerId);
    const p = pos(e);
    lastX = p.x; lastY = p.y;
    ctx.beginPath();
    ctx.arc(p.x, p.y, BRUSH, 0, Math.PI * 2);
    ctx.fill();
    markCells(p.x, p.y);
    checkReveal();
  }

  function onMove(e) {
    if (!isDrawing || isRevealed) return;
    e.preventDefault();
    const events = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
    for (const ev of (events.length ? events : [e])) {
      const p = pos(ev);
      ctx.beginPath();
      ctx.moveTo(lastX, lastY);
      ctx.lineTo(p.x, p.y);
      ctx.stroke();
      markSegment(lastX, lastY, p.x, p.y);
      lastX = p.x; lastY = p.y;
    }
    checkReveal();
  }

  function onUp() { isDrawing = false; }

  function checkReveal() {
    if (isRevealed) return;
    if ((coveredCount / (cols * rows)) * 100 > REVEAL_AT) {
      isRevealed = true;
      isDrawing = false;
      canvas.style.opacity = '0';
      canvas.style.pointerEvents = 'none';
      setTimeout(() => { canvas.style.display = 'none'; }, 400);
      triggerCelebration();
    }
  }

  canvas.addEventListener('pointerdown', onDown);
  canvas.addEventListener('pointermove', onMove);
  canvas.addEventListener('pointerup', onUp);
  canvas.addEventListener('pointercancel', onUp);

  // Debounced resize; ignore height-only changes (mobile URL bar show/hide)
  let resizeTimer;
  addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      if (!isRevealed && innerWidth !== lastW) initCanvas();
    }, 150);
  });

  /* ---------- Celebration ---------- */
  function triggerCelebration() {
    // Let the reveal paint first, then start the heavy work
    requestAnimationFrame(() => {
      triggerFallingHearts();
      triggerConfetti();
    });
  }

  // Hearts: one canvas, pre-rendered emoji sprites, one rAF loop
  function triggerFallingHearts() {
    const EMOJIS = ['❤️', '💖', '💘', '💕', '💗'];
    const COUNT = reduceMotion ? 12 : (isMobile ? 28 : 40);
    const SPR = 36; // sprite size in CSS px
    const dpr = Math.min(devicePixelRatio || 1, maxDpr);
    const w = innerWidth, h = innerHeight;

    const fx = document.createElement('canvas');
    fx.className = 'fx-canvas';
    fx.style.zIndex = 10;
    fx.width = Math.round(w * dpr);
    fx.height = Math.round(h * dpr);
    document.body.appendChild(fx);
    const c = fx.getContext('2d');

    const sprites = EMOJIS.map(e => {
      const s = document.createElement('canvas');
      s.width = s.height = Math.ceil(SPR * dpr);
      const sc = s.getContext('2d');
      sc.font = `${28 * dpr}px sans-serif`;
      sc.textAlign = 'center';
      sc.textBaseline = 'middle';
      sc.fillText(e, s.width / 2, s.height / 2);
      return s;
    });

    const hearts = Array.from({ length: COUNT }, (_, i) => {
      const dur = (Math.random() * 2 + 2.5);           // seconds
      return {
        x: Math.random() * w,
        start: i * 100,                                 // ms
        speed: (h * 1.1 + 50) / dur,                    // px/s
        spin: (Math.PI * 2) / dur,                      // rad/s
        scale: Math.random() * .5 + .8,
        sprite: sprites[(Math.random() * sprites.length) | 0],
        done: false
      };
    });

    let t0 = 0;
    function frame(t) {
      if (!t0) t0 = t;
      const elapsed = t - t0;
      c.setTransform(1, 0, 0, 1, 0, 0);
      c.clearRect(0, 0, fx.width, fx.height);
      let alive = 0;
      for (const p of hearts) {
        if (p.done) continue;
        alive++;
        if (elapsed < p.start) continue;
        const age = (elapsed - p.start) / 1000;
        const y = -50 + p.speed * age;
        if (y > h + 50) { p.done = true; continue; }
        const a = p.spin * age, cos = Math.cos(a), sin = Math.sin(a);
        c.setTransform(cos * dpr, sin * dpr, -sin * dpr, cos * dpr, p.x * dpr, y * dpr);
        const size = SPR * p.scale;
        c.drawImage(p.sprite, -size / 2, -size / 2, size, size);
      }
      if (alive) requestAnimationFrame(frame);
      else fx.remove();
    }
    requestAnimationFrame(frame);
  }

  // Confetti: dedicated canvas, rendered in a worker where supported
  function triggerConfetti() {
    const cc = document.createElement('canvas');
    cc.className = 'fx-canvas';
    cc.style.zIndex = 100;
    document.body.appendChild(cc);

    const shoot = confetti.create(cc, {
      resize: true,
      useWorker: true,
      disableForReducedMotion: true
    });

    const colors = ['#ffb6c1', '#ff1493', '#ff69b4', '#ffffff', '#ffd700'];
    const count = isMobile ? 10 : 22;
    const ticks = isMobile ? 140 : 200;
    const end = Date.now() + 4000;

    function burst() {
      shoot({ particleCount: count, angle: 60,  spread: 60, origin: { x: 0, y: 1 }, colors, ticks, zIndex: 100 });
      shoot({ particleCount: count, angle: 120, spread: 60, origin: { x: 1, y: 1 }, colors, ticks, zIndex: 100 });
    }

    burst();
    const interval = setInterval(() => {
      if (Date.now() > end) {
        clearInterval(interval);
        // Remove the canvas once the last particles have faded
        setTimeout(() => { shoot.reset?.(); cc.remove(); }, 4000);
        return;
      }
      burst();
    }, isMobile ? 300 : 250);
  }

  if (document.readyState === 'complete') initCanvas();
  else addEventListener('load', initCanvas);
})();
</script>
</body>
</html>
