<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Surprise for Riya</title>
<!-- Adding canvas-confetti library for the cracker explosion effect -->
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@500;700&display=swap" rel="stylesheet">

<style>
  body, html {
    margin: 0; 
    padding: 0; 
    width: 100%; 
    height: 100%; 
    overflow: hidden;
    display: flex; 
    justify-content: center; 
    align-items: center;
    font-family: 'Poppins', sans-serif;
    background-color: #fff0f5; /* Soft blush base */
    overscroll-behavior: none;
  }
  
  /* Romantic Flowing Liquid Background */
   .orb {
    position: absolute; 
    border-radius: 50%; 
    filter: blur(80px); 
    opacity: 0.8;
    animation: floatOrb 12s infinite alternate ease-in-out;
  }
  .orb1 { width: 350px; height: 350px; background: #ff4081; top: -50px; left: -50px; }
  .orb2 { width: 450px; height: 450px; background: #ff80ab; bottom: -100px; right: -50px; animation-delay: -3s; }
  .orb3 { width: 300px; height: 300px; background: #ff6e40; top: 40%; left: 30%; animation-delay: -6s; }
  
  @keyframes floatOrb {
    0% { transform: translate(0, 0) scale(1); }
    100% { transform: translate(60px, 60px) scale(1.3); }
  }

  .fluid-blob {
    position: absolute;
    border-radius: 50%;
    filter: blur(80px);
    opacity: 0.8;
    mix-blend-mode: multiply;
    will-change: transform;
  }

  /* Fluid animations */
  @keyframes flow1 {
    0% { transform: translate(0, 0) scale(1); }
    33% { transform: translate(15vw, 20vh) scale(1.2); }
    66% { transform: translate(-10vw, 30vh) scale(0.9); }
    100% { transform: translate(0, 0) scale(1); }
  }

  @keyframes flow2 {
    0% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(-20vw, -15vh) scale(1.3); }
    100% { transform: translate(0, 0) scale(1); }
  }

  .blob-pink {
    top: -20%; left: -10%; 
    width: 70vw; height: 70vw;
    background: #ffb6c1; 
    animation: flow1 22s infinite ease-in-out alternate;
  }

  .blob-red {
    bottom: -20%; right: -10%; 
    width: 80vw; height: 80vw;
    background: #ff8fa3; 
    animation: flow2 26s infinite ease-in-out alternate;
  }

  .blob-peach {
    top: 20%; left: 20%; 
    width: 60vw; height: 60vw;
    background: #ffdab9; 
    animation: flow1 24s infinite ease-in-out alternate-reverse;
  }

  /* Scratch Card Container */
  .card-container {
    position: relative; 
    width: 85%;
    max-width: 380px; 
    aspect-ratio: 4/3;
    border-radius: 24px; 
    box-shadow: 0 20px 40px rgba(255, 105, 180, 0.25), 0 0 20px rgba(255, 255, 255, 0.6);
    overflow: hidden; 
    background: rgba(255, 255, 255, 0.95);
    backdrop-filter: blur(10px);
  }
  
  .message {
    position: absolute; 
    top: 0; left: 0; 
    width: 100%; height: 100%;
    display: flex; 
    justify-content: center; 
    align-items: center;
    text-align: center; 
    font-family: 'Dancing Script', cursive;
    font-size: 2.8rem; 
    line-height: 1.3;
    background: linear-gradient(135deg, #f43f5e, #db2777);
    -webkit-background-clip: text; 
    -webkit-text-fill-color: transparent;
    padding: 20px; 
    box-sizing: border-box;
    z-index: 1;
  }
  
  canvas {
    position: absolute; 
    top: 0; left: 0; 
    width: 100%; height: 100%;
    cursor: crosshair; 
    transition: opacity 0.8s ease;
    z-index: 2;
  }
  
  /* Hearts Animation Container */
  .hearts-container {
    position: fixed; 
    top: 0; left: 0; 
    width: 100%; height: 100%;
    pointer-events: none; 
    z-index: 10; 
    overflow: hidden;
  }
  
  .heart {
    position: absolute; 
    font-size: 28px; 
    animation: fall linear forwards;
  }
  
  @keyframes fall {
    to { transform: translateY(110vh) rotate(360deg); }
  }
</style>
</head>
<body>
  <!-- Fluid Aurora Elements -->
  <div class="aurora-container">
    <div class="fluid-blob blob-pink"></div>
    <div class="fluid-blob blob-red"></div>
    <div class="fluid-blob blob-peach"></div>
  </div>
  
  <!-- Container for falling heart emojis -->
  <div class="hearts-container" id="hearts-container"></div>

  <!-- The Scratch Card -->
  <div class="card-container" id="card-container">
    <div class="message">eeeeeeeeeeeeeeeeee      Happiest Birthday Riya! ❤️❤️ </div>
    <canvas id="scratch-pad"></canvas>
  </div>

  <script>
    const container = document.getElementById('card-container');
    const canvas = document.getElementById('scratch-pad');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    let isDrawing = false;
    let isRevealed = false;

    function initCanvas() {
        canvas.width = container.offsetWidth;
        canvas.height = container.offsetHeight;
        drawCover();
    }

    function drawCover() {
        // Create the metallic silver scratch layer
        const gradient = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
        gradient.addColorStop(0, '#e2e8f0');
        gradient.addColorStop(0.5, '#cbd5e1');
        gradient.addColorStop(1, '#94a3b8');
        
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        // Add subtle texture to look like a real scratch card
        ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
        for(let i = 0; i < canvas.width; i+=4) {
            for(let j = 0; j < canvas.height; j+=4) {
                if (Math.random() > 0.5) ctx.fillRect(i, j, 2, 2);
            }
        }
        
        // Add instruction text on top
        ctx.fillStyle = '#64748b';
        ctx.font = 'bold 22px Poppins, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('✨ Scratch Here ✨', canvas.width / 2, canvas.height / 2);
    }

    function getMousePos(evt) {
      const rect = canvas.getBoundingClientRect();
      let clientX = evt.clientX;
      let clientY = evt.clientY;
      
      if(evt.touches && evt.touches.length > 0) {
          clientX = evt.touches[0].clientX;
          clientY = evt.touches[0].clientY;
      }
      return {
        x: clientX - rect.left,
        y: clientY - rect.top
      };
    }

    function startDrawing(e) {
      if (isRevealed) return;
      isDrawing = true;
      scratch(e);
    }

    function endDrawing() {
      isDrawing = false;
      checkReveal();
    }

    function scratch(e) {
      if (!isDrawing || isRevealed) return;
      e.preventDefault(); 
      
      const pos = getMousePos(e);
      // 'destination-out' erases the silver layer to show what's underneath
      ctx.globalCompositeOperation = 'destination-out';
      ctx.beginPath();
      ctx.arc(pos.x, pos.y, 35, 0, Math.PI * 2); // Brush size
      ctx.fill();
    }

    let checkTimeout;
    function checkReveal() {
      if (isRevealed || checkTimeout) return;
      
      checkTimeout = setTimeout(() => {
          const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
          const pixels = imageData.data;
          let transparentPixels = 0;
          
          // Sample pixels (every 16th byte = 4th pixel) for performance
          for (let i = 3; i < pixels.length; i += 16) {
            if (pixels[i] < 128) transparentPixels++;
          }
          
          const totalPixels = pixels.length / 16;
          const percentage = (transparentPixels / totalPixels) * 100;
          
          // Reveal when 40% is scratched
          if (percentage > 40) {
            isRevealed = true;
            canvas.style.opacity = '0';
            setTimeout(() => {
                canvas.style.display = 'none';
                triggerCelebration();
            }, 800);
          }
          checkTimeout = null;
      }, 100);
    }

    // Run both celebration effects together!
    function triggerCelebration() {
        triggerFallingHearts();
        triggerConfettiCrackers();
    }
    
    function triggerFallingHearts() {
        const heartsContainer = document.getElementById('hearts-container');
        const emojis = ['❤️', '💖', '💘', '💕', '💗'];
        
        for(let i = 0; i < 40; i++) {
            setTimeout(() => {
                const heart = document.createElement('div');
                heart.className = 'heart';
                heart.innerText = emojis[Math.floor(Math.random() * emojis.length)];
                heart.style.left = (Math.random() * 100) + 'vw';
                heart.style.top = '-50px';
                // Randomize speed and size for natural look
                heart.style.animationDuration = (Math.random() * 2 + 2.5) + 's';
                heart.style.transform = `scale(${Math.random() * 0.5 + 0.8})`;
                heartsContainer.appendChild(heart);
                
                // Cleanup DOM after animation completes
                setTimeout(() => heart.remove(), 5000);
            }, i * 100); 
        }
    }

    function triggerConfettiCrackers() {
        const duration = 4000;
        const end = Date.now() + duration;

        (function frame() {
            // Shoot from bottom left corner
            confetti({
                particleCount: 6,
                angle: 60,
                spread: 60,
                origin: { x: 0, y: 1 },
                colors: ['#ffb6c1', '#ff1493', '#ff69b4', '#ffffff', '#ffd700'],
                zIndex: 100
            });
            // Shoot from bottom right corner
            confetti({
                particleCount: 6,
                angle: 120,
                spread: 60,
                origin: { x: 1, y: 1 },
                colors: ['#ffb6c1', '#ff1493', '#ff69b4', '#ffffff', '#ffd700'],
                zIndex: 100
            });

            if (Date.now() < end) {
                requestAnimationFrame(frame);
            }
        }());
    }

    // Attach Event listeners
    canvas.addEventListener('mousedown', startDrawing);
    canvas.addEventListener('mousemove', scratch);
    window.addEventListener('mouseup', endDrawing);
    
    // Touch Events for mobile
    canvas.addEventListener('touchstart', startDrawing, {passive: false});
    canvas.addEventListener('touchmove', scratch, {passive: false});
    window.addEventListener('touchend', endDrawing);
    
    // Handle resizing beautifully
    window.addEventListener('resize', () => {
        if (!isRevealed) initCanvas();
    });

    // Initialize the canvas when the page loads
    window.onload = initCanvas;
  </script>
</body>
</html>
